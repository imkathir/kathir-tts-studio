<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  
  <!-- Subtle border highlight -->
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />

  <!-- Equalizer Wave Bar (Stem of K) -->
  <g filter="url(#glow)">
    <!-- Main vertical stem -->
    <rect x="22" y="24" width="8" height="52" rx="4" fill="url(#waveGrad)" />
    
    <!-- Diagonal Upper Arm of K as Soundwave -->
    <path d="M28 50 L48 28 C50 26 53 26 55 28 L57 30 C59 32 59 35 57 37 L41 53 Z" fill="url(#waveGrad)" />
    
    <!-- Diagonal Lower Arm of K as Soundwave -->
    <path d="M37 49 L58 71 C60 73 60 76 58 78 L56 80 C54 82 51 82 49 80 L28 57 Z" fill="url(#waveGrad)" />

    <!-- Acoustic Sound Waveform Arcs -->
    <path d="M66 36 C73 44 73 56 66 64" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M76 28 C87 39 87 61 76 72" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.65" />
    
    <!-- Sound dot particles -->
    <circle cx="85" cy="50" r="3" fill="#ffffff" opacity="0.85" />
  </g>
</svg>
